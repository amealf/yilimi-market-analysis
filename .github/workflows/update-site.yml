name: Update site

on:
  workflow_dispatch:
  schedule:
    # Beijing time: every 4 hours at minute 17.
    - cron: "17 */4 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build static site
        run: python scripts/build_site.py --all

      - name: Persist global rates cache
        run: |
          if [ -d data/global_30y_bond_intraday ] || [ -d data/global_30y_bond_daily ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            [ -d data/global_30y_bond_intraday ] && git add data/global_30y_bond_intraday
            [ -d data/global_30y_bond_daily ] && git add data/global_30y_bond_daily
            if ! git diff --cached --quiet; then
              git commit -m "Update global 30Y rates cache [skip ci]"
              git push
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Delete deployed Pages artifact
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              core.setFailed(`Invalid Pages artifact ID: ${process.env.PAGES_ARTIFACT_ID}`);
              return;
            }

            await github.rest.actions.deleteArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });
            core.info(`Deleted deployed Pages artifact ${artifactId}.`);
